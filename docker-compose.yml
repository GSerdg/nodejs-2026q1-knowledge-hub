services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kh-api
    image: ${DOCKER_HUB_USERNAME:-gserdg}/knowledge-hub-api:latest
    restart: on-failure
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - NODE_ENV=production
      - IS_DOCKER=true
      - PROXY_HOST=host.docker.internal
      - PROXY_PORT=8888
      # - POSTGRES_HOST=db
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    networks:
      - kh-network
    healthcheck:
      test: curl -f http://localhost:${PORT:-4000}/user || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: kh-db
    ports:
      - '5432:5432'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kh-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: kh-adminer
    profiles:
      - debug
    ports:
      - '8080:8080'
    networks:
      - kh-network

  vectordb:
    image: qdrant/qdrant:latest
    container_name: kh-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    networks:
      - kh-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6333/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kh-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
